aid: stellar-sleep
name: Stellar Sleep
description: >-
  Stellar Sleep (Y Combinator S23, backed by Initialized Capital) is a mobile
  app that helps people with chronic insomnia sleep better using psychology
  rather than medication. Its personalized program is based on CBT-I
  (Cognitive Behavioral Therapy for Insomnia), the first-line treatment
  recommended by sleep experts, delivered through iOS and Android apps
  published by Merlin Collective, LLC. Started at Harvard Innovation Labs in
  2021, Stellar Sleep also offers clinician and employer programs, with
  clinical-system integrations arranged by its team. It is a consumer
  digital-health product with no public developer API, SDK, or MCP surface.
